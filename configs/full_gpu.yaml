# ===== Cấu hình ĐẦY ĐỦ cho GPU (Colab T4): PHA (a) train trên tiếng Anh =====
# Chạy: python -m src.train --config configs/full_gpu.yaml
run: {name: en_base, out_dir: outputs/runs, seed: 42, device: auto, deterministic: false}

data:
  root: data/synth
  lang: en
  charset: data/charset_en.txt
  train_split: train
  val_split: val
  batch_size: 128
  num_workers: 2                    # Colab thường chỉ có 2 CPU; cache_in_ram giúp bớt nghẽn đọc ảnh
  bucket: true
  cache_in_ram: true                # ~0,6 GB RAM cho 50k ảnh ở H=48
  max_train_samples: null
  max_val_samples: null
  max_width: 768

model:                              # H=48 (khuyến nghị từ Giai đoạn 2): T đủ cho font hẹp, dấu VI rõ hơn
  img_height: 48
  cnn: {channels: [64, 128, 256, 512], width_strides: [2, 2]}
  rnn: {use_rnn: true, hidden: 256, layers: 2, dropout: 0.2, use_packing: false}
  head_dropout: 0.1

optim: {name: adamw, lr: 0.001, weight_decay: 0.01, betas: [0.9, 0.999], clip_grad_norm: 5.0}
sched: {name: onecycle, pct_start: 0.15, div_factor: 25, final_div_factor: 1000}

train:
  epochs: 30
  amp: true                         # mixed precision (chỉ có tác dụng trên GPU)
  log_every: 100
  max_infeasible_frac: 0.002
  early_stop: {patience: 6, min_delta: 0.0005}

init_from: null
debug: {overfit_n: 0}
