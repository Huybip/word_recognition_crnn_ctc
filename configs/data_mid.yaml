# Bộ dữ liệu VI cỡ vừa dùng để huấn luyện mô hình `mid_vi` trong báo cáo (khác configs/data.yaml ở out_root và counts.vi).
# Chạy: python data/generate_dataset.py --config configs/data_mid.yaml --lang vi
seed: 42
out_root: data/synth_mid
render:
  size: 64
  margins:
  - 4
  - 4
  - 4
  - 4
img_height: 32
counts:
  en:
    train: 50000
    val: 5000
    test: 5000
    hard: 2000
    train_clean: 20000
  vi:
    train: 6000
    val: 300
    test: 800
    hard: 400
    train_clean: 0
smoke_counts:
  train: 400
  val: 80
  test: 80
  hard: 80
  train_clean: 80
aug_level:
  train: normal
  val: normal
  test: normal
  hard: hard
  train_clean: none
text:
  max_chars: 25
  n_words_weights:
    en:
    - 0.55
    - 0.3
    - 0.15
    vi:
    - 0.7
    - 0.3
  case_weights:
    lower: 0.5
    capitalize: 0.2
    upper: 0.2
    title: 0.1
  code_ratio: 0.08
vocab:
  split_ratio:
    train: 0.8
    val: 0.1
    test: 0.05
    hard: 0.05
  vi_file: data/vi_words.txt
fonts:
  use_trdg_fonts: true
  extra_dirs:
  - data/fonts_extra
  system_dirs:
  - /usr/share/fonts
  exclude_regex: Hairline|Thin|unifont|Math
  holdout_ratio: 0.2
  min_fonts_warn: 6
